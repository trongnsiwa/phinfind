<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A4A3A" flood-opacity="0.10" />
    </filter>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A328" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="cream-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8F5F0" />
    </linearGradient>
  </defs>

  <!-- Decorative Sparkles -->
  <path d="M 40 44 L 42 50 L 48 52 L 42 54 L 40 60 L 38 54 L 32 52 L 38 50 Z" fill="url(#gold-grad)" />
  <circle cx="166" cy="52" r="3" fill="#B8860B" opacity="0.5" />

  <!-- Photo Frame (Sharp 90-degree Corners) -->
  <g filter="url(#soft-shadow)">
    <!-- Photo Card -->
    <rect x="44" y="50" width="104" height="96" fill="url(#cream-card)" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Photo Inner Area -->
    <rect x="54" y="60" width="84" height="64" fill="#F4EFE6" stroke="#DCD2C3" stroke-width="1.5" />
    
    <!-- Sun -->
    <circle cx="74" cy="78" r="7" fill="url(#gold-grad)" />
    
    <!-- Mountain Horizon -->
    <path d="M 54 124 L 78 98 L 96 112 L 114 94 L 138 124 Z" fill="#E5DAC9" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Prominent Plus Badge (Sharp Square in Bottom Right) -->
  <g filter="url(#soft-shadow)">
    <rect x="122" y="118" width="38" height="38" fill="url(#gold-grad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    <!-- Plus Icon -->
    <line x1="141" y1="127" x2="141" y2="147" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="131" y1="137" x2="151" y2="137" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
