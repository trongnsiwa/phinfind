<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A4A3A" flood-opacity="0.10" />
    </filter>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A328" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F5D4D" />
      <stop offset="100%" stop-color="#5A4A3A" />
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8F5F0" />
    </linearGradient>
  </defs>

  <!-- Steam Wisps Rising -->
  <path d="M 82 66 C 76 52 88 44 80 30" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 100 62 C 94 48 106 38 98 24" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 118 66 C 112 52 124 44 116 30" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Coffee Cup & Saucer -->
  <g filter="url(#soft-shadow)">
    <!-- Sharp Plate Saucer -->
    <polygon points="44,156 148,156 142,164 50,164" fill="url(#cup-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />

    <!-- Cup Handle (Natural Ergonomic Loop) -->
    <path d="M 130 102 C 154 102 154 136 128 138" fill="none" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" />

    <!-- Cup Body (Clean Tapered Geometry) -->
    <polygon points="58,92 134,92 126,146 66,146" fill="url(#cup-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cup Rim & Dark Coffee Surface -->
    <polygon points="62,92 130,92 128,100 64,100" fill="url(#brown-grad)" stroke="#5A4A3A" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Latte Art Heart on Coffee Surface -->
    <path d="M 96 98 C 93 94 88 94 88 97 C 88 100 96 103 96 103 C 96 103 104 100 104 97 C 104 94 99 94 96 98 Z" fill="#FFF8EE" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <path d="M 158 48 L 160 53 L 165 55 L 160 57 L 158 62 L 156 57 L 151 55 L 156 53 Z" fill="url(#gold-grad)" />
  <circle cx="42" cy="78" r="3" fill="#B8860B" opacity="0.5" />
</svg>
