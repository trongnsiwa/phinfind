<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A4A3A" flood-opacity="0.10" />
    </filter>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A328" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F5D4D" />
      <stop offset="100%" stop-color="#5A4A3A" />
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE6DA" />
    </linearGradient>
    <linearGradient id="condensed-milk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F3EBDD" />
    </linearGradient>
  </defs>

  <!-- Steam Curves Rising from Filter -->
  <path d="M 64 36 C 60 26 68 20 64 12" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 136 36 C 140 26 132 20 136 12" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Glass Cup with Layers (Bottom) -->
  <g filter="url(#soft-shadow)">
    <!-- Glass Body Outline (Sharp Tapered Polygon) -->
    <path d="M 66 116 L 70 168 L 130 168 L 134 116 Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Condensed Milk Layer (Bottom) -->
    <path d="M 70 152 L 70 168 L 130 168 L 130 152 Z" fill="url(#condensed-milk)" />
    
    <!-- Brewed Dark Coffee Layer (Middle) -->
    <path d="M 68 128 L 70 152 L 130 152 L 132 128 Z" fill="url(#brown-grad)" />

    <!-- Coffee Drop Falling -->
    <circle cx="100" cy="122" r="3.5" fill="url(#brown-grad)" />
  </g>

  <!-- Phin Filter Unit (Top, Sharp Straight Edges) -->
  <g filter="url(#soft-shadow)">
    <!-- Spreader / Saucer Plate (Sharp Rectangle) -->
    <rect x="50" y="108" width="100" height="8" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    <rect x="62" y="110" width="76" height="4" fill="url(#gold-grad)" opacity="0.8" />

    <!-- Phin Main Cylinder Chamber (Sharp Rectangle) -->
    <rect x="66" y="58" width="68" height="50" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Decorative Gold Center Band -->
    <rect x="66" y="78" width="68" height="10" fill="url(#gold-grad)" stroke="#5A4A3A" stroke-width="2.5" />

    <!-- Left & Right Small Phin Wing Handles (Sharp Rectangles) -->
    <rect x="58" y="80" width="8" height="8" fill="url(#brown-grad)" stroke="#5A4A3A" stroke-width="2.5" />
    <rect x="134" y="80" width="8" height="8" fill="url(#brown-grad)" stroke="#5A4A3A" stroke-width="2.5" />

    <!-- Phin Lid Base -->
    <rect x="62" y="54" width="76" height="6" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />

    <!-- Phin Lid Dome (Sharp Trapezoid) -->
    <path d="M 68 54 L 78 42 L 122 42 L 132 54 Z" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Lid Top Knob (Sharp Rectangle) -->
    <rect x="94" y="34" width="12" height="8" fill="url(#gold-grad)" stroke="#5A4A3A" stroke-width="2.5" />
  </g>

  <!-- Sparkles -->
  <path d="M 160 52 L 162 57 L 167 59 L 162 61 L 160 66 L 158 61 L 153 59 L 158 57 Z" fill="url(#gold-grad)" />
  <circle cx="40" cy="94" r="2.5" fill="#B8860B" opacity="0.5" />
</svg>
