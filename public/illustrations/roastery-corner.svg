<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A4A3A" flood-opacity="0.10" />
    </filter>
    
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A328" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F5D4D" />
      <stop offset="100%" stop-color="#5A4A3A" />
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE6DA" />
    </linearGradient>
  </defs>

  <!-- Exhaust Steam Wisps -->
  <path d="M 112 26 C 110 18 116 14 114 8" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 120 22 C 122 16 118 12 122 6" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Roaster Chimney Pipe (Sharp Rectangles) -->
  <rect x="106" y="26" width="10" height="38" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" />
  <line x1="104" y1="26" x2="118" y2="26" stroke="#5A4A3A" stroke-width="3" stroke-linecap="round" />

  <!-- Top Hopper / Bean Funnel (Sharp Trapezoid & Rectangle) -->
  <g filter="url(#soft-shadow)">
    <!-- Funnel Cone -->
    <polygon points="68,64 76,38 96,38 104,64" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    <!-- Funnel Top Gold Collar (Sharp Rectangle) -->
    <rect x="74" y="34" width="24" height="4" fill="url(#gold-grad)" stroke="#5A4A3A" stroke-width="2.5" />
  </g>

  <!-- Machine Base Stand (Sharp Rectangle) -->
  <g filter="url(#soft-shadow)">
    <rect x="44" y="116" width="76" height="48" fill="url(#brown-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Pressure / Temp Dial Gauge -->
    <circle cx="62" cy="138" r="8" fill="#FFFFFF" stroke="#5A4A3A" stroke-width="2.5" />
    <line x1="62" y1="138" x2="66" y2="134" stroke="#B8860B" stroke-width="2" stroke-linecap="round" />

    <!-- Machine Control Switches (Sharp Rectangles) -->
    <rect x="78" y="132" width="12" height="6" fill="url(#gold-grad)" stroke="#5A4A3A" stroke-width="2" />
    <rect x="78" y="142" width="12" height="6" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="2" />
  </g>

  <!-- Roasting Drum (Main Horizontal Chamber, Sharp Rectangle) -->
  <g filter="url(#soft-shadow)">
    <!-- Drum Housing -->
    <rect x="50" y="64" width="70" height="52" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Center Roaster Sight Glass / Inspection Window -->
    <circle cx="85" cy="90" r="16" fill="url(#gold-grad)" stroke="#5A4A3A" stroke-width="3" />
    <!-- Glass Glint & Bean Silhouette -->
    <circle cx="85" cy="90" r="11" fill="url(#brown-grad)" />
    <path d="M 85 82 Q 83 88 86 90 Q 89 92 85 98" stroke="#FAF5ED" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Cooling Tray (Bottom Right, Sharp Hexagonal/Polygon Tray) -->
  <g filter="url(#soft-shadow)">
    <!-- Sharp Tray Polygon -->
    <polygon points="120,136 156,136 164,152 112,152" fill="url(#metal-grad)" stroke="#5A4A3A" stroke-width="3" stroke-linejoin="round" />
    <!-- Agitator Rotating Arm -->
    <line x1="120" y1="144" x2="156" y2="144" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />
    <!-- Central Agitator Pin -->
    <circle cx="138" cy="144" r="3.5" fill="#5A4A3A" />
    <!-- Small Roasted Beans in Pan -->
    <circle cx="128" cy="140" r="2" fill="url(#brown-grad)" />
    <circle cx="146" cy="147" r="2" fill="url(#brown-grad)" />
    <circle cx="134" cy="149" r="1.8" fill="url(#gold-grad)" />
  </g>

  <!-- Sparkles -->
  <path d="M 40 44 L 42 49 L 47 51 L 42 53 L 40 58 L 38 53 L 33 51 L 38 49 Z" fill="url(#gold-grad)" />
</svg>
