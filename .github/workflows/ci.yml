name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip build notice
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL == '' }}
        run: echo "Build step skipped: NEXT_PUBLIC_SUPABASE_URL secret is not configured (e.g. PR from external fork)."

      - name: Build application
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://example.vercel.app' }}
        run: pnpm build

      - name: Upload build manifest on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: .next/build-manifest.json
          if-no-files-found: ignore

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: always()
    steps:
      - name: Display CI Summary
        run: |
          echo "================ CI STATUS SUMMARY ================"
          echo "| Job     | Result   |"
          echo "|---------|----------|"
          echo "| quality | ${{ needs.quality.result }} |"
          echo "| build   | ${{ needs.build.result }} |"
          echo "==================================================="

          echo "### CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:---|:---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality (lint, typecheck, test) | ${{ needs.quality.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build (Next.js) | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "CI failed: quality checks did not pass."
            exit 1
          fi

          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "CI failed: build job failed or was cancelled."
            exit 1
          fi

          echo "All required CI checks passed."
